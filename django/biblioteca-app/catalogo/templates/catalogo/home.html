<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'catalogo/styles.css' %}?v=3">
    <title>Inicio</title>
</head>
<body>
    <h1>Inicio</h1>
    <p>Bienvenido Sr(a). {{ request.user.username }} a la aplicación de gestion de libros</p>
    <p>Desde aquí puedes gestionar los libros disponibles en la biblioteca</p>
    <h2>Menú Principal</h2>
    <ul>
        <li><a href="{% url 'libro_list' %}">Ver Lista de Libros</a></li>
        <li><a href="{% url 'categoria_list' %}">Lista de Categorías</a></li>
        <li><a href="{% url 'autor_list' %}">Lista de Autores</a></li>
    </ul>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar Sesión</button>
    </form>
</body>
</html>
